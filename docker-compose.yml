version: "3.9"

services:
  app:
    build: .
    container_name: yunpansou
    restart: unless-stopped
    ports:
      - "3090:3090"
    environment:
      - PORT=3090
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      # ---- 远程 MySQL 直连（NAS）----
      # 变量名必须是 PANSOU_MYSQL_*（lib/mysql.js 实际读取的名称）
      # 值来自项目根目录 .env 文件（docker compose 自动读取），勿硬编码密码
      - PANSOU_MYSQL_HOST=${PANSOU_MYSQL_HOST:-192.168.1.65}
      - PANSOU_MYSQL_PORT=${PANSOU_MYSQL_PORT:-3306}
      - PANSOU_MYSQL_USER=${PANSOU_MYSQL_USER:-pansou}
      - PANSOU_MYSQL_PASSWORD=${PANSOU_MYSQL_PASSWORD:?请在 .env 中设置 PANSOU_MYSQL_PASSWORD}
      - PANSOU_MYSQL_DATABASE=${PANSOU_MYSQL_DATABASE:-pansou}
    volumes:
      # data/ 挂载到宿主机：JSON 兜底/镜像持久化，删容器不丢数据
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3090/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
